<!doctype html>
<!-- A stand-in for the Motion player, for previewing one scene here: the kit's helpers that ng-prism films use, with
     the player's own easing, camera, cursor and typist logic. Driven by preview.mjs; not a replacement for the player. -->
<html>
    <head>
        <meta charset="utf-8" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="../templates/base.css" />
        <style>
            html,
            body {
                margin: 0;
                background: #000;
            }
            #stage {
                position: relative;
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                background: #080d19;
                --sans: Inter, system-ui, sans-serif;
                --mono: 'JetBrains Mono', monospace;
            }
            .harness-cursor {
                position: absolute;
                left: 0;
                top: 0;
                z-index: 50;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="stage"></div>
        <script>
            const clamp01 = (x) => Math.max(0, Math.min(1, x));
            const seg = (t, a, b) => clamp01((t - a) / (b - a));
            const lerp = (a, b, p) => a + (b - a) * p;
            const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
            const ei = (x) => Math.pow(clamp01(x), 3);
            const eio = (x) => ((x = clamp01(x)), x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
            const eox = (x) => 1 - Math.pow(2, -10 * clamp01(x));
            const eob = (x, c1 = 1.4) => ((x = clamp01(x)), 1 + (c1 + 1) * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2));
            const rng = (seed) => {
                let s = seed >>> 0;
                return () => ((s = (s * 1664525 + 1013904223) >>> 0), s / 4294967296);
            };
            const stage = document.getElementById('stage');
            const TYPING = [];
            const srect = (n) => {
                const r = n.getBoundingClientRect(),
                    s = stage.getBoundingClientRect();
                return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
            };
            class Camera {
                constructor(el) {
                    this.el = el;
                    this.keys = [{ t: 0, cx: 960, cy: 540, z: 1 }];
                    this.state = { tx: 0, ty: 0, z: 1, cx: 960, cy: 540 };
                    el.style.transformOrigin = '0 0';
                }
                set(keys) {
                    this.keys = keys.slice().sort((a, b) => a.t - b.t);
                    return this;
                }
                at(t) {
                    const ks = this.keys;
                    let i = 0;
                    for (let k = 0; k < ks.length; k++) if (ks[k].t <= t) i = k;
                    const a = ks[i],
                        b = ks[i + 1] || null;
                    const from = b ? (b.cut ? b.t : b.from !== undefined ? b.from : a.t + (a.hold || 0)) : Infinity;
                    const dT = Math.max(0, Math.min(t, from) - a.t);
                    let cx = a.cx,
                        cy = a.cy,
                        z = a.z;
                    if (a.drift) {
                        cx += a.drift[0] * dT;
                        cy += a.drift[1] * dT;
                        z *= Math.exp((a.drift[2] || 0) * dT);
                    }
                    if (b && !b.cut && t > from) {
                        const f = (b.ease || eio)(seg(t, from, b.t));
                        z = Math.exp(lerp(Math.log(z), Math.log(b.z), f));
                        cx = lerp(cx, b.cx, f);
                        cy = lerp(cy, b.cy, f);
                    }
                    return { cx, cy, z };
                }
                apply(t) {
                    const v = this.at(t);
                    const tx = 960 - v.cx * v.z,
                        ty = 540 - v.cy * v.z;
                    this.state = { tx, ty, z: v.z, cx: v.cx, cy: v.cy };
                    this.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${v.z.toFixed(5)})`;
                    return this.state;
                }
            }
            function makeKit(box, mods, assets) {
                const kit = {
                    stage: box,
                    W: 1920,
                    H: 1080,
                    seg,
                    lerp,
                    eo,
                    ei,
                    eio,
                    eox,
                    eob,
                    clamp01,
                    rng,
                    srect,
                    Camera,
                    typing: { times: TYPING },
                    h: (s) => {
                        const d = document.createElement('div');
                        d.innerHTML = s;
                        return d.firstElementChild;
                    },
                    css: (t) => {
                        const s = document.createElement('style');
                        s.textContent = t;
                        box.append(s);
                    },
                    esc: (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'),
                    module: (n) => (mods[n] === undefined ? null : mods[n]),
                    assets: { url: (n) => assets[n] },
                    camrect: (node, cam) => {
                        const r = srect(node),
                            c = cam.state;
                        return { x: (r.x - c.tx) / c.z, y: (r.y - c.ty) / c.z, w: r.w / c.z, h: r.h / c.z };
                    },
                    typist: (text, t0, cps, seed = 7) => {
                        const r = rng(seed),
                            times = [];
                        let t = t0;
                        for (let i = 0; i < text.length; i++) {
                            let d = (1 / cps) * (0.55 + 0.9 * r());
                            if (text[i] === ' ') d += 0.035;
                            if (text[i - 1] === '.' || text[i - 1] === '!') d += 0.16;
                            t += d;
                            times.push(t);
                        }
                        TYPING.push(...times);
                        return {
                            text,
                            times,
                            end: t,
                            count(now) {
                                let n = 0;
                                while (n < times.length && times[n] <= now) n++;
                                return n;
                            },
                            at(now) {
                                return text.slice(0, this.count(now));
                            }
                        };
                    },
                    cursor: () => {
                        const el = kit.h(
                            '<div class="harness-cursor"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5.2 2.9v17.4l4.3-4.1 2.7 6.2 2.9-1.25-2.65-6.05h5.85z" fill="#111" stroke="#fff" stroke-width="1.35" stroke-linejoin="round"/></svg></div>'
                        );
                        box.append(el);
                        const c = {
                            el,
                            keys: [],
                            clicks: [],
                            visible: () => 1,
                            render(t) {
                                const op = this.visible(t);
                                el.style.display = op > 0.001 ? '' : 'none';
                                const P = (k) => (typeof k.at === 'function' ? k.at() : k.at),
                                    C = this.keys;
                                let p = [-100, -100];
                                if (C.length) {
                                    p = P(C[C.length - 1]);
                                    if (t <= C[0].t) p = P(C[0]);
                                    else
                                        for (let i = 0; i < C.length - 1; i++)
                                            if (t >= C[i].t && t < C[i + 1].t) {
                                                const b = C[i + 1],
                                                    q = eio(seg(t, C[i].t, b.t)),
                                                    A = P(C[i]),
                                                    B = P(b);
                                                let x = lerp(A[0], B[0], q),
                                                    y = lerp(A[1], B[1], q);
                                                if (b.bow) {
                                                    const n = Math.sin(Math.PI * q) * b.bow;
                                                    x += -(B[1] - A[1]) * n;
                                                    y += (B[0] - A[0]) * n;
                                                }
                                                p = [x, y];
                                            }
                                }
                                el.style.opacity = op;
                                el.style.transform = `translate(${p[0]}px, ${p[1]}px)`;
                            }
                        };
                        return c;
                    },
                    scene: (id, def) => (window.DEF = def)
                };
                return kit;
            }
            window.boot = async ({ scene, shared, mods, assets, dur }) => {
                await document.fonts.ready;
                if (shared) new Function('kit', shared)(makeKit(stage, mods, assets));
                const box = document.createElement('div');
                box.style.cssText = 'position:absolute;inset:0';
                stage.append(box);
                const kit = makeKit(box, mods, assets);
                kit.dur = dur;
                new Function('kit', scene)(kit);
                if (DEF.init) await DEF.init.call(DEF, kit);
                window.renderAt = (t) => DEF.render.call(DEF, t, kit);
                renderAt(0);
            };
        </script>
    </body>
</html>
