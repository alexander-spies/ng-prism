<div class="prism-perf-panel">
    <prism-panel-toolbar>
        <prism-tabs
            toolbarStart
            size="sm"
            ariaLabel="Performance views"
            [items]="tabs"
            [active]="activeTab()"
            (activeChange)="selectTab($event)" />
        <div
            toolbarEnd
            class="prism-perf-actions">
            @if (activeTab() === 'render') {
                <button
                    prismButton
                    variant="secondary"
                    (click)="renderService.clear()">
                    Clear
                </button>
                @if (renderService.isRecording()) {
                    <button
                        prismButton
                        variant="primary"
                        [title]="profileTitle()"
                        (click)="renderService.stopRecording()">
                        Pause
                    </button>
                } @else {
                    <button
                        prismButton
                        variant="primary"
                        [title]="profileTitle()"
                        (click)="renderService.startRecording()">
                        Profile
                    </button>
                }
            }
            @if (activeTab() === 'memory') {
                <button
                    prismButton
                    variant="secondary"
                    (click)="memoryService.clear()">
                    Clear
                </button>
                <button
                    prismButton
                    variant="primary"
                    (click)="captureMemorySnapshots()">
                    Snapshot
                </button>
            }
        </div>
    </prism-panel-toolbar>

    <div class="prism-perf-content">
        @switch (activeTab()) {
            @case ('bundle') {
                <perf-bundle-section
                    [metrics]="bundleMetrics()"
                    [warnKb]="thresholds.bundleWarnKb"
                    [critKb]="thresholds.bundleCritKb" />
            }
            @case ('render') {
                <perf-render-section
                    [renderService]="renderService"
                    [warnMs]="thresholds.renderWarnMs"
                    [critMs]="thresholds.renderCritMs" />
            }
            @case ('memory') {
                <perf-memory-section [memoryService]="memoryService" />
            }
        }
    </div>
</div>
