@if (renderService(); as svc) {
    @if (svc.initialRender() !== null || svc.rerenders().length > 0) {
        <div class="perf-grid">
            @let initial = statusOf(svc.initialRender());
            <prism-metric-card
                label="Initial render"
                unit="ms"
                [value]="formatMs(svc.initialRender())"
                [tone]="initial?.tone ?? null"
                [statusLabel]="initial?.label ?? null"
                [title]="budgetTitle('First render of the component')" />
            <prism-metric-card
                label="Avg re-render"
                unit="ms"
                [value]="formatMs(svc.avgRerender())"
                [title]="svc.sampleCount() + ' samples'" />
            <prism-metric-card
                label="Slowest"
                unit="ms"
                [value]="formatMs(svc.maxRerender())" />
            <prism-metric-card
                label="P95"
                unit="ms"
                [value]="formatMs(svc.p95Rerender())" />
            <prism-metric-card
                label="Last render"
                unit="ms"
                [value]="formatMs(svc.lastRerender())" />
        </div>

        @if (svc.rerenders().length > 1) {
            <div
                class="perf-block"
                [title]="
                    'Last ' +
                    svc.sampleCount() +
                    ' samples · avg ' +
                    formatMs(svc.avgRerender()) +
                    ' ms · max ' +
                    formatMs(svc.maxRerender()) +
                    ' ms · line at ' +
                    warnMs() +
                    ' ms'
                ">
                <span class="perf-block__label">Render time trace</span>
                <perf-sparkline
                    [samples]="svc.rerenders()"
                    [thresholdWarn]="warnMs()"
                    [height]="80" />
            </div>
        }
    } @else {
        <div class="perf-empty">
            <span>No profiling data yet</span>
            <span>Click Profile to start recording render times</span>
        </div>
    }
}
