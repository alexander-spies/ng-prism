@if (variants().length > 0) {
    <nav
        class="variant-ribbon"
        aria-label="Variants">
        <prism-tabs
            class="variant-ribbon-tabs"
            ariaLabel="Variants"
            [items]="tabItems()"
            [active]="'' + rendererService.activeVariantIndex()"
            (activeChange)="select($event)" />
        <div class="variant-ribbon-right">
            <button
                prismIconButton
                size="xs"
                title="Previous variant"
                aria-label="Previous variant"
                [disabled]="rendererService.activeVariantIndex() === 0"
                [attr.aria-disabled]="rendererService.activeVariantIndex() === 0"
                (click)="prev()">
                <prism-icon
                    name="chevron-right"
                    [size]="14"
                    style="transform: rotate(180deg)" />
            </button>
            <button
                prismIconButton
                size="xs"
                title="Next variant"
                aria-label="Next variant"
                [disabled]="rendererService.activeVariantIndex() >= variants().length - 1"
                [attr.aria-disabled]="rendererService.activeVariantIndex() >= variants().length - 1"
                (click)="next()">
                <prism-icon
                    name="chevron-right"
                    [size]="14" />
            </button>
        </div>
    </nav>
}
