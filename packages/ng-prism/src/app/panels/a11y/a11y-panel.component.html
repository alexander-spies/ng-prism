<div class="a11y-panel">
    <prism-panel-toolbar>
        <prism-tabs
            toolbarStart
            size="sm"
            ariaLabel="Accessibility views"
            [items]="tabs()"
            [active]="state.activeTab()"
            (activeChange)="selectTab($event)" />
    </prism-panel-toolbar>

    <div class="a11y-content">
        @if (disabled()) {
            <div class="a11y-disabled"> Accessibility audit disabled for this component. </div>
        } @else {
            @switch (state.activeTab()) {
                @case ('violations') {
                    <prism-a11y-violations />
                }
                @case ('keyboard') {
                    <prism-a11y-keyboard />
                }
                @case ('tree') {
                    <prism-a11y-tree />
                }
                @case ('sr') {
                    <prism-a11y-sr />
                }
            }
        }
    </div>
</div>
