<div
    class="panel"
    [class.panel--collapsed]="mobileLayout.mobile() && mobileLayout.panelCollapsed()">
    <div class="panel-tabs">
        <prism-tabs
            ariaLabel="Panels"
            panelIdPrefix="panel-"
            [items]="tabItems()"
            [active]="panelService.activePanelId()"
            (activeChange)="$event && panelService.activePanelId.set($event)"
            (tabClick)="onTabClick($event)" />
    </div>
    <div
        class="panel-body"
        [id]="'panel-' + panelService.activePanelId()"
        role="tabpanel">
        @for (entry of renderedPanelsArray(); track entry.id) {
            <div
                class="panel-pane"
                [hidden]="entry.id !== panelService.activePanelId()">
                <ng-container *ngComponentOutlet="entry.component; inputs: panelInputs(); injector: entry.injector ?? envInjector" />
            </div>
        }
    </div>
</div>
