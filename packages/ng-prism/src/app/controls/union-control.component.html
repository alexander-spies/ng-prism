<div
    class="ctl-pills"
    role="group">
    @for (option of options(); track option) {
        <button
            class="ctl-pill"
            [class.ctl-pill--active]="option === value()"
            [attr.aria-pressed]="option === value()"
            (click)="valueChange.emit(option)">
            {{ option }}
        </button>
    }
</div>
