@if (subject(); as s) {
    <section class="comp-head">
        <span class="comp-crumb">{{ category() }}</span>
        <h1 class="comp-title">{{ s.showcaseConfig.title }}</h1>

        <prism-head-info
            [selector]="selector()"
            [code]="code()"
            [className]="s.className"
            [description]="s.showcaseConfig.description"
            [tags]="s.showcaseConfig.tags ?? []"
            [variantCount]="variantCount()"
            [stateCount]="stateCount()"
            [facts]="facts()" />

        @if (statusBadge(); as badge) {
            <prism-badge
                class="comp-status"
                [class.comp-status--wip]="status() === 'wip'"
                dot
                [tone]="badge.tone"
                [label]="badge.label"
                [attr.title]="badge.tooltip" />
        }

        @if (hasParts()) {
            <prism-head-parts />
        }

        @if (comp()) {
            <prism-head-gauge [metrics]="metrics()" />
        }

        <span class="comp-spacer"></span>

        <span class="comp-head-end"><ng-content select="[headEnd]" /></span>
    </section>
}
