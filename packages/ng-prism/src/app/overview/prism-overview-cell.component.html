<div
    class="cell__stage"
    [attr.data-bg]="unfitReason() === null ? bg() : null"
    [attr.data-unfit]="unfitReason() === null ? null : ''">
    <div class="cell__mount"><ng-container #outlet /></div>
    @if (unfitReason() !== null) {
        <span
            class="cell__unfit"
            aria-hidden="true"
            >–</span
        >
    }
</div>
@if (mode() === 'sheet') {
    <span class="cell__caption">{{ caption() }}</span>
}
