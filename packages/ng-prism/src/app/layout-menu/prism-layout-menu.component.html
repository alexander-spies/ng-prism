<div class="layout-menu">
    <button
        class="layout-menu__trigger"
        (click)="open.set(!open())"
        [class.layout-menu__trigger--active]="open()"
        title="Layout options">
        <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none">
            <circle
                cx="8"
                cy="3"
                r="1.25"
                fill="currentColor" />
            <circle
                cx="8"
                cy="8"
                r="1.25"
                fill="currentColor" />
            <circle
                cx="8"
                cy="13"
                r="1.25"
                fill="currentColor" />
        </svg>
    </button>
    @if (open()) {
        <div
            class="layout-menu__backdrop"
            (click)="open.set(false)"></div>
        <div
            class="layout-menu__dropdown"
            [style]="theme.appTokens()">
            <button
                class="layout-menu__item"
                (click)="toggle('sidebar')">
                <span
                    class="layout-menu__check"
                    [class.layout-menu__check--on]="layout.sidebarVisible()">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 12 12"
                        fill="none">
                        <path
                            d="M2 6l3 3 5-5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="layout-menu__label">Show sidebar</span>
                <span class="layout-menu__kbd"><kbd>⌥</kbd><kbd>S</kbd></span>
            </button>
            <button
                class="layout-menu__item"
                (click)="toggle('toolbar')">
                <span
                    class="layout-menu__check"
                    [class.layout-menu__check--on]="layout.toolbarVisible()">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 12 12"
                        fill="none">
                        <path
                            d="M2 6l3 3 5-5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="layout-menu__label">Show variant rail</span>
                <span class="layout-menu__kbd"><kbd>⌥</kbd><kbd>T</kbd></span>
            </button>
            <button
                class="layout-menu__item"
                (click)="toggle('addons')">
                <span
                    class="layout-menu__check"
                    [class.layout-menu__check--on]="layout.addonsVisible()">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 12 12"
                        fill="none">
                        <path
                            d="M2 6l3 3 5-5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="layout-menu__label">Show addons panel</span>
                <span class="layout-menu__kbd"><kbd>⌥</kbd><kbd>A</kbd></span>
            </button>
        </div>
    }
</div>
