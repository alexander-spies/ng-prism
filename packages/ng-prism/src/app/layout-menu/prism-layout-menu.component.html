<div class="layout-menu">
    <button
        prismIconButton
        size="md"
        aria-label="Layout options"
        aria-haspopup="menu"
        [attr.aria-expanded]="open()"
        [pressed]="open() ? true : null"
        (click)="open.set(!open())"
        title="Layout options">
        <prism-icon
            name="more-vertical"
            [size]="16" />
    </button>
    @if (open()) {
        <div
            class="layout-menu__backdrop"
            (click)="open.set(false)"></div>
        <div
            class="layout-menu__dropdown"
            [style]="theme.appTokens()">
            <button
                class="layout-menu__item"
                (click)="toggle('sidebar')">
                <span
                    class="layout-menu__check"
                    [class.layout-menu__check--on]="layout.sidebarVisible()">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 12 12"
                        fill="none">
                        <path
                            d="M2 6l3 3 5-5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="layout-menu__label">Show sidebar</span>
                <span class="layout-menu__kbd"><kbd>⌥</kbd><kbd>S</kbd></span>
            </button>
            <button
                class="layout-menu__item"
                (click)="toggle('toolbar')">
                <span
                    class="layout-menu__check"
                    [class.layout-menu__check--on]="layout.toolbarVisible()">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 12 12"
                        fill="none">
                        <path
                            d="M2 6l3 3 5-5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="layout-menu__label">Show variant rail</span>
                <span class="layout-menu__kbd"><kbd>⌥</kbd><kbd>T</kbd></span>
            </button>
            <button
                class="layout-menu__item"
                (click)="toggle('addons')">
                <span
                    class="layout-menu__check"
                    [class.layout-menu__check--on]="layout.addonsVisible()">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 12 12"
                        fill="none">
                        <path
                            d="M2 6l3 3 5-5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="layout-menu__label">Show addons panel</span>
                <span class="layout-menu__kbd"><kbd>⌥</kbd><kbd>A</kbd></span>
            </button>
        </div>
    }
</div>
