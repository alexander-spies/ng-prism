<svg
    xmlns="http://www.w3.org/2000/svg"
    [attr.viewBox]="viewBox"
    [attr.width]="width()"
    [attr.height]="size()"
    [attr.aria-hidden]="decorative() ? 'true' : null"
    [attr.role]="decorative() ? null : 'img'"
    [attr.aria-label]="decorative() ? null : 'ng-prism'"
    focusable="false">
    <defs>
        @for (g of gradients; track g.id) {
            <linearGradient
                [attr.id]="uid + g.id"
                x1="0"
                y1="0"
                [attr.x2]="g.x2"
                [attr.y2]="g.y2">
                @for (stop of g.stops; track $index) {
                    <stop
                        [attr.offset]="stop[0]"
                        [attr.stop-color]="stop[1]" />
                }
            </linearGradient>
        }
    </defs>
    @for (facet of facets; track $index) {
        <polygon
            [attr.points]="facet.points"
            [attr.fill]="fill(facet)"
            [attr.opacity]="facet.opacity ?? null" />
    }
</svg>
