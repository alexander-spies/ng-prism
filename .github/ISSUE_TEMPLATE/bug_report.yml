name: Bug Report
description: Something in ng-prism does not work as documented
title: 'fix: '
labels: ['bug', 'needs triage']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to file a report. A minimal reproduction is
              the most useful thing you can give us.

              Please do not report security vulnerabilities here. Use the
              [private advisory form](https://github.com/alexander-spies/ng-prism/security/advisories/new)
              instead.

    - type: textarea
      id: summary
      attributes:
          label: What happened?
          description: A clear description of the bug, plus what you expected instead.
          placeholder: |
              The scanner skips components whose file uses a path alias.
              I expected them to appear in the sidebar like any other component.
      validations:
          required: true

    - type: dropdown
      id: package
      attributes:
          label: Affected package
          options:
              - '@ng-prism/core'
              - '@ng-prism/plugin-box-model'
              - '@ng-prism/plugin-coverage'
              - '@ng-prism/plugin-figma'
              - '@ng-prism/plugin-jsdoc'
              - '@ng-prism/plugin-perf'
              - '@ng-prism/plugin-visual-regression'
              - Documentation site
              - Not sure
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Where does it go wrong?
          description: Roughly which stage of the pipeline is involved.
          options:
              - 'ng add / schematics'
              - 'Build time: scanner or manifest generation'
              - 'Build time: builder (prism / prism-build)'
              - 'Runtime: styleguide app (canvas, controls, navigation, panels)'
              - 'Theming or custom UI sections'
              - Not sure
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Minimal reproduction
          description: |
              A link to a repository or StackBlitz that reproduces the issue, or the
              smallest `@Showcase` / `ng-prism.config.ts` snippet that triggers it.
              Issues without a reproduction may be closed if we cannot confirm them.
          render: typescript
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          value: |
              1.
              2.
              3.
      validations:
          required: true

    - type: input
      id: version-prism
      attributes:
          label: ng-prism version
          placeholder: '22.2.1'
      validations:
          required: true

    - type: input
      id: version-angular
      attributes:
          label: Angular version
          placeholder: '22.1.7'
      validations:
          required: true

    - type: input
      id: version-node
      attributes:
          label: Node / package manager
          placeholder: 'Node 22.11.0, npm 10.9.0'
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Console output or stack trace
          description: Terminal output from the builder and/or the browser console. Automatically formatted as code.
          render: shell

    - type: checkboxes
      id: checks
      attributes:
          label: Before you submit
          options:
              - label: I searched existing issues and this is not a duplicate.
                required: true
              - label: My components use signal APIs (`input()` / `output()`). Legacy `@Input()` / `@Output()` decorators are not supported.
                required: true
